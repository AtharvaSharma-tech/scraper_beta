<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSE Feed: Raw vs AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f4f5; color: #18181b; margin: 0; padding: 2rem; }
    h1 { text-align: center; margin-bottom: 2rem; color: #09090b; }
    
    .container { display: flex; gap: 2rem; max-width: 1200px; margin: 0 auto; }
    .column { flex: 1; background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .col-title { font-size: 1.25rem; font-weight: 700; border-bottom: 2px solid #e4e4e7; padding-bottom: 0.75rem; margin-bottom: 1.5rem; }
    
    .card { border: 1px solid #e4e4e7; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; background: #fafafa; }
    .company { font-weight: 700; color: #2563eb; font-size: 1.1rem; }
    .date { font-size: 0.8rem; color: #71717a; margin-bottom: 0.5rem; }
    .badge { background: #e0e7ff; color: #3730a3; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: inline-block; margin-bottom: 0.5rem; }
    
    .summary-text { font-size: 0.9rem; color: #3f3f46; margin-top: 0.5rem; border-top: 1px solid #e4e4e7; padding-top: 0.5rem; }
    .pdf-link { font-size: 0.8rem; color: #2563eb; text-decoration: none; font-weight: 600; }
    .pdf-link:hover { text-decoration: underline; }

    @media (max-width: 768px) { .container { flex-direction: column; } }
  </style>
</head>
<body>

  <h1>BSE Diagnostic Dashboard</h1>

  <div class="container">
    <!-- Left Column: Raw Data -->
    <div class="column">
      <div class="col-title">📊 Section 1: Raw BSE Feed</div>
      <div id="raw-feed">Loading raw data...</div>
    </div>

    <!-- Right Column: AI Data -->
    <div class="column">
      <div class="col-title">🤖 Section 2: AI Summaries</div>
      <div id="ai-feed">Loading AI summaries...</div>
    </div>
  </div>

  <script>
    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    fetch('./data/announcements.json')
      .then(res => res.json())
      .then(data => {
        const rawContainer = document.getElementById('raw-feed');
        const aiContainer = document.getElementById('ai-feed');
        
        if (!data || !data.length) {
          rawContainer.innerHTML = 'No data found.';
          aiContainer.innerHTML = 'No data found.';
          return;
        }

        // Render Raw Data
        rawContainer.innerHTML = data.map(item => {
          const pdfUrl = item.ATTACHMENTNAME ? `https://www.bseindia.com/xml-data/corpfiling/AttachLive/${item.ATTACHMENTNAME}` : '#';
          return `
            <div class="card">
              <div class="company">${item.SLONGNAME || 'Company'}</div>
              <div class="date">${formatDate(item.NEWS_DT)}</div>
              <div class="badge">${item.NEWSSUB || 'Update'}</div>
              <br><a href="${pdfUrl}" target="_blank" class="pdf-link">View PDF</a>
            </div>
          `;
        }).join('');

        // Render AI Data
        aiContainer.innerHTML = data.map(item => {
          const parsedSummary = item.summary ? marked.parse(item.summary) : 'No summary available.';
          return `
            <div class="card">
              <div class="company">${item.SLONGNAME || 'Company'}</div>
              <div class="summary-text">${parsedSummary}</div>
            </div>
          `;
        }).join('');
      })
      .catch(() => {
        document.getElementById('raw-feed').innerHTML = 'Waiting for data...';
        document.getElementById('ai-feed').innerHTML = 'Waiting for data...';
      });
  </script>
</body>
</html>
