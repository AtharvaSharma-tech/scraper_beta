<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSE Corporate Filings & Market Feed</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --accent: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      max-width: 860px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    header {
      margin-bottom: 2.25rem;
      animation: fadeIn 0.6s ease-out;
    }

    .top-meta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #047857;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      margin-bottom: 0.85rem;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }

    .subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  box-shadow 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  border-color 0.25s ease;
      opacity: 0;
      transform: translateY(16px);
      animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.08), 0 8px 12px -8px rgba(15, 23, 42, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.65rem;
    }

    .company { font-size: 1.2rem; font-weight: 700; color: #0f172a; letter-spacing: -0.015em; }

    .date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #bfdbfe;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .summary {
      color: #334155;
      font-size: 0.94rem;
      border-top: 1px solid #f1f5f9;
      padding-top: 1rem;
    }

    .summary p { margin-bottom: 0.6rem; }
    .summary ul { padding-left: 1.35rem; margin-bottom: 0.6rem; }
    .summary li { margin-bottom: 0.45rem; padding-left: 0.2rem; }
    .summary strong { color: #0f172a; font-weight: 700; }

    .footer-actions { margin-top: 1rem; display: flex; justify-content: flex-end; }

    .pdf-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .pdf-link:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: scale(1.02);
    }

    .skeleton-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      animation: pulseSkeleton 1.5s infinite ease-in-out;
    }

    .skeleton-line { height: 16px; background: #e2e8f0; border-radius: 6px; margin-bottom: 0.75rem; }
    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 70%; }

    /* Load More Button Styling */
    .load-more-container {
      text-align: center;
      margin-top: 2rem;
      margin-bottom: 4rem;
    }

    #load-more {
      background-color: var(--card-bg);
      color: var(--primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem 2rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: none; /* Hidden until data loads */
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    #load-more:hover {
      border-color: var(--primary);
      background-color: var(--primary-soft);
      transform: translateY(-2px);
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    @keyframes pulseSkeleton {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-meta">
      <span class="live-dot"></span>
      Automated AI Intel
    </div>
    <h1>BSE Corporate Disclosures</h1>
    <p class="subtitle">Live regulatory filings scanned and summarized via neural pipelines</p>
  </header>

  <div id="feed">
    <div id="feed-content">
      <!-- Skeletons load initially -->
      <div class="skeleton-card">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line"></div>
      </div>
    </div>
    
    <div class="load-more-container">
      <button id="load-more">Load Next 10</button>
    </div>
  </div>

  <script>
    let allData = [];
    let currentIndex = 0;
    const itemsPerPage = 10;

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-IN', {
          day: '2-digit',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return dateStr;
      }
    }

    function cleanCategory(subject, company) {
      if (!subject) return 'Corporate Filing';
      let clean = subject.replace(company, '').replace(/^[-\s:|]+/, '');
      return clean.length > 70 ? clean.substring(0, 70) + '...' : clean;
    }

    function renderItems() {
      const container = document.getElementById('feed-content');
      const loadMoreBtn = document.getElementById('load-more');
      
      const slice = allData.slice(currentIndex, currentIndex + itemsPerPage);
      if (slice.length === 0) return;

      // Clear skeletons if this is the first load
      if (currentIndex === 0) {
        container.innerHTML = '';
      }

      const html = slice.map((item, index) => {
        const company = item.SLONGNAME || 'Corporate Update';
        const category = cleanCategory(item.NEWSSUB, company);
        const formattedDate = formatDate(item.NEWS_DT);
        const parsedSummary = item.summary ? marked.parse(item.summary) : '<p>Summary pending...</p>';
        const pdfUrl = item.ATTACHMENTNAME 
          ? `https://www.bseindia.com/xml-data/corpfiling/AttachLive/${item.ATTACHMENTNAME}` 
          : null;

        const delay = (index * 0.08).toFixed(2);

        return `
          <article class="card" style="animation-delay: ${delay}s;">
            <div class="card-header">
              <div class="company">${company}</div>
              <div class="date">${formattedDate}</div>
            </div>
            <div class="badge">${category}</div>
            <div class="summary">${parsedSummary}</div>
            ${pdfUrl ? `
              <div class="footer-actions">
                <a class="pdf-link" href="${pdfUrl}" target="_blank" rel="noopener">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                  Original PDF
                </a>
              </div>
            ` : ''}
          </article>
        `;
      }).join('');

      container.insertAdjacentHTML('beforeend', html);
      currentIndex += itemsPerPage;

      // Hide or show the load more button based on remaining data
      if (currentIndex >= allData.length) {
        loadMoreBtn.style.display = 'none';
      } else {
        loadMoreBtn.style.display = 'inline-block';
      }
    }

    // Attach event listener to the button
    document.getElementById('load-more').addEventListener('click', renderItems);

    fetch('./data/announcements.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('feed-content');
        if (!data || !data.length) {
          container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No filings found at the moment.</p>';
          return;
        }
        allData = data;
        renderItems();
      })
      .catch(() => {
        document.getElementById('feed-content').innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem;">Feed is currently building or waiting for first data ingest...</p>';
      });
  </script>
</body>
</html>
